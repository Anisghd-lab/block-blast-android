name: block_blast_android
description: "Block Blast Modern - Jeu de puzzle de blocs viral ultra-fluide pour Android avec moteur de combos, particules et respect des règles Google Play."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # State Management
  provider: ^6.1.2
  
  # Typography & Design
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  
  # Local Storage for Highscores & Settings (Offline First)
  shared_preferences: ^2.3.2
  
  # Haptic & Feedback
  flutter_vibrate: ^1.3.0
  
  # UI Icons & Effects
  confetti: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/icons/
