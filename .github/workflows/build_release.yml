name: Build Play Store AAB & Release Assets

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality_check:
    name: Contrôle Qualité (Analyse & Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyse statique
        run: flutter analyze --no-fatal-infos

      - name: Tests unitaires
        run: flutter test

  build:
    name: Compilation APKs Release de Test
    needs: quality_check
    runs-on: ubuntu-latest
    env:
      ANDROID_USER_HOME: /tmp/android-user-home
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Android user directory
        run: mkdir -p "$ANDROID_USER_HOME/.android"

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Launcher Icons
        run: |
          if grep -q "flutter_launcher_icons" pubspec.yaml; then
            dart run flutter_launcher_icons || true
          fi

      - name: Setup Android Keystore for Play Store signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            {
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyPassword=$KEY_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "storeFile=upload-keystore.jks"
            } > android/key.properties
          else
            echo "Avertissement: KEYSTORE_BASE64 non défini dans les secrets, utilisation du keystore par défaut."
          fi

      - name: Prepare Release Assets Directory
        run: |
          mkdir -p release_assets

      # Construction des APKs de test
      - name: Build Test Release APKs
        run: |
          # 1. APK Universel (compatible avec tous les appareils)
          flutter build apk --release --android-skip-build-dependency-validation
          cp build/app/outputs/flutter-apk/app-release.apk release_assets/BlockBlast-universal.apk

          # 2. APKs optimisés par ABI (arm64, arm32, x86_64)
          flutter build apk --release --split-per-abi --android-skip-build-dependency-validation
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release_assets/BlockBlast-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release_assets/BlockBlast-arm32.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release_assets/BlockBlast-x86_64.apk

          echo "=== Fichiers APK prêts pour test ==="
          ls -lh release_assets/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: block-blast-test-apks
          path: |
            release_assets/*.apk

      - name: Determine Version
        id: version_step
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            RAW_VER=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
            TAG="v$RAW_VER"
          fi
          echo "APP_VERSION=$TAG" >> $GITHUB_ENV

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION }}
          name: "Block Blast Release ${{ env.APP_VERSION }}"
          body: |
            ### 🎮 Block Blast - Release ${{ env.APP_VERSION }}

            #### ✨ Nouveautés & Mises à jour :
            * **Mode Sombre / Clair (Dark & Light Mode)** dynamique pour tous les thèmes (Néon Arcade, Joyaux Célestes, Bois Rustique, Zen Pastel).
            * **Bascule 1-clic ☀️ / 🌙** intégrée dans l'en-tête du jeu et dans les paramètres.
            * **Sauvegarde persistante** des préférences utilisateur (SharedPreferences).
            * **Nouveaux graphismes et fonds aléatoires** haute définition pour les boosters et les arrières-plans.
            * **Suppression complète** de l'ancien thème temporaire Sugar Delight.
            * **Optimisation de la grille 8x8** : remontée sans aucun chevauchement des boosters, hitboxes élargies des pièces.

            #### 📱 APKs Directs
            * **`BlockBlast-universal.apk`** : Compatible avec tous les téléphones et tablettes Android (installation directe recommandée).
            * **`BlockBlast-arm64.apk`** : Optimisé pour smartphones 64-bit récents (performances maximales).
            * **`BlockBlast-arm32.apk`** : Pour smartphones 32-bit (ARMv7).
            * **`BlockBlast-x86_64.apk`** : Pour émulateurs PC / Android Studio.
          draft: false
          prerelease: false
          files: |
            release_assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
