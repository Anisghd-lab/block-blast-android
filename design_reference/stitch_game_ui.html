<style>
    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined';
      font-weight: normal;
      font-style: normal;
      font-size: 24px;
      line-height: 1;
      display: inline-block;
      text-transform: none;
      letter-spacing: normal;
      word-wrap: normal;
      white-space: nowrap;
      direction: ltr;
    }

    /* Tactile Inset Wells */
    .cell-well {
      background-color: #0c0d1d;
      box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.75), inset 0 0 3px rgba(0, 0, 0, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    /* 3D Glossy Acrylic Blocks */
    .block-tile {
      position: relative;
      border-radius: 0.375rem;
      box-shadow: 0 4px 0 #070811, 0 5px 8px rgba(0,0,0,0.6);
      transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .block-tile::before {
      content: '';
      position: absolute;
      top: 1px;
      left: 2px;
      right: 2px;
      height: 38%;
      background: linear-gradient(180deg, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.05) 100%);
      border-radius: 0.25rem 0.25rem 2px 2px;
      pointer-events: none;
    }
    .block-tile::after {
      content: '';
      position: absolute;
      inset: 0;
      border-top: 1px solid rgba(255,255,255,0.6);
      border-bottom: 2px solid rgba(0,0,0,0.4);
      border-radius: 0.375rem;
      pointer-events: none;
    }

    /* Neon Palette Variants */
    .block-cyan {
      background: linear-gradient(135deg, #00f2fe 0%, #00a3af 100%);
      box-shadow: 0 4px 0 #004f53, 0 0 10px rgba(0, 242, 254, 0.45);
    }
    .block-pink {
      background: linear-gradient(135deg, #ff5261 0%, #ba0029 100%);
      box-shadow: 0 4px 0 #680015, 0 0 10px rgba(255, 82, 97, 0.45);
    }
    .block-yellow {
      background: linear-gradient(135deg, #fed929 0%, #c49b00 100%);
      box-shadow: 0 4px 0 #544600, 0 0 10px rgba(254, 217, 41, 0.45);
    }
    .block-lime {
      background: linear-gradient(135deg, #00f5a0 0%, #00995c 100%);
      box-shadow: 0 4px 0 #004d2e, 0 0 10px rgba(0, 245, 160, 0.45);
    }
    .block-purple {
      background: linear-gradient(135deg, #b026ff 0%, #63009c 100%);
      box-shadow: 0 4px 0 #3b005c, 0 0 10px rgba(176, 38, 255, 0.45);
    }
    .block-orange {
      background: linear-gradient(135deg, #ff8400 0%, #b84a00 100%);
      box-shadow: 0 4px 0 #5c2500, 0 0 10px rgba(255, 132, 0, 0.45);
    }

    /* Blast & Line Detonation Animation */
    @keyframes detonationFlash {
      0%, 100% { filter: brightness(1.2); }
      50% { filter: brightness(2.8) contrast(1.2); transform: scale(1.06); }
    }
    .detonating-cell {
      animation: detonationFlash 0.55s ease-in-out infinite alternate;
      z-index: 10;
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.85; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.02); }
    }
    .combo-banner-pulse {
      animation: pulseGlow 0.9s ease-in-out infinite;
    }

    @keyframes floatScore {
      0% { transform: translateY(4px) scale(0.9); opacity: 0.9; }
      50% { transform: translateY(-8px) scale(1.05); opacity: 1; }
      100% { transform: translateY(4px) scale(0.9); opacity: 0.9; }
    }
    .score-burst-float {
      animation: floatScore 1.8s ease-in-out infinite;
    }

    /* 3D Push Button Effect */

      box-shadow: 0 4px 0 #070811;
      transition: all 0.08s ease-out;
    }
    .tactile-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #070811;
    }
  </style>
